<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Смена пароля — Планировщик</title>
<meta name="robots" content="noindex" />
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --card:#ffffff; --text:#18181b; --text2:#52525b; --border:#e4e4e7; --accent:#6366f1; --danger:#dc2626; --ok:#16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#09090b; --card:#18181b; --text:#fafafa; --text2:#a1a1aa; --border:#27272a; --accent:#818cf8; --danger:#f87171; --ok:#4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 64px; background:var(--bg); color:var(--text);
         font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size:1.5rem; line-height:1.25; margin:0 0 4px; }
  .muted { color:var(--text2); font-size:.92rem; }
  label { display:block; margin:16px 0 6px; font-size:.9rem; color:var(--text2); }
  input { width:100%; padding:11px 12px; font-size:1rem; color:var(--text);
          background:var(--card); border:1px solid var(--border); border-radius:10px; }
  button { margin-top:18px; width:100%; padding:12px 16px; font-size:1rem; font-weight:600;
           color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  button[disabled] { opacity:.5; cursor:not-allowed; }
  .msg { margin-top:14px; padding:11px 12px; border-radius:10px; font-size:.93rem; }
  .err { background:color-mix(in srgb, var(--danger) 14%, transparent); color:var(--danger); }
  .ok  { background:color-mix(in srgb, var(--ok) 14%, transparent); color:var(--ok); }
  .hide { display:none; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Смена пароля</h1>
  <p class="muted">Приложение «Планировщик». Придумайте новый пароль — старый перестанет работать.</p>

  <!-- Пока не убедились, что ссылка действительна, форму не показываем:
       иначе пользователь введёт пароль и лишь потом узнает, что ссылка
       просрочена. -->
  <div id="loading" class="msg">Проверяем ссылку…</div>

  <form id="form" class="hide" autocomplete="off">
    <label for="pw">Новый пароль</label>
    <input id="pw" type="password" minlength="6" autocomplete="new-password" placeholder="минимум 6 символов" />
    <label for="pw2">Повторите пароль</label>
    <input id="pw2" type="password" minlength="6" autocomplete="new-password" />
    <button id="go" type="submit">Сохранить пароль</button>
  </form>

  <div id="msg" class="msg hide"></div>

  <p class="muted" style="margin-top:28px">
    Ссылка не сработала или устарела? Запросите новую в приложении:
    «Настройки» → «Аккаунт» → «Забыли пароль».
  </p>
</main>

<script type="module">
  // Отдельная страница, а не экран приложения. Причина: Supabase кладёт
  // токен восстановления в hash (#access_token=…), а у приложения
  // hash-роутер — токен сломал бы маршрут. Здесь роутера нет, поэтому
  // detectSessionInUrl можно смело включить.
  const URL_ = 'https://oaiqwcorpjigmpbkjpqe.supabase.co'
  const KEY = 'sb_publishable_NZIUZyNxzmVxWV2amgkNQg_mg0XMnTU'

  const loading = document.getElementById('loading')
  const form = document.getElementById('form')
  const msg = document.getElementById('msg')
  const pw = document.getElementById('pw')
  const pw2 = document.getElementById('pw2')
  const go = document.getElementById('go')

  function show(el) { el.classList.remove('hide') }
  function hide(el) { el.classList.add('hide') }
  function say(text, kind) {
    msg.textContent = text
    msg.className = 'msg ' + kind
    show(msg)
  }

  // Содержимое ссылки читаем ДО создания клиента: клиент разбирает и чистит
  // hash сам, и полагаться на порядок нельзя.
  function linkParams() {
    // токен приходит в hash (implicit), но у части потоков — в query
    const h = new URLSearchParams(location.hash.replace(/^#/, ''))
    const q = new URLSearchParams(location.search.replace(/^\?/, ''))
    const get = (k) => h.get(k) || q.get(k)
    return {
      error: get('error_description') || get('error'),
      // признак того, что в ссылке ВООБЩЕ что-то есть
      hasToken: !!(get('access_token') || get('code') || get('token_hash')),
    }
  }
  const link = linkParams()

  const BAD_LINK = 'Ссылка недействительна или устарела.'
  const HINT_NEW = 'Запросите новую в приложении.'

  let ready = false
  function openForm() {
    if (ready) return
    ready = true
    hide(loading)
    hide(msg)
    show(form)
  }
  function fail(text) {
    if (ready) return
    ready = true
    hide(loading)
    hide(form)
    say(text, 'err')
  }

  // Библиотека тянется со стороннего CDN. Импорт ДИНАМИЧЕСКИЙ и в try:
  // при статическом импорте недоступный CDN обрывал весь модуль, и страница
  // навсегда застывала на «Проверяем ссылку…» без единого слова о причине.
  let createClient
  try {
    ;({ createClient } = await import('https://esm.sh/@supabase/supabase-js@2'))
  } catch {
    fail('Не удалось загрузить страницу целиком — проверьте связь и обновите.')
    throw new Error('supabase-js load failed')
  }

  const supabase = createClient(URL_, KEY, {
    auth: {
      detectSessionInUrl: true,
      // Сессию НЕ храним: страница нужна ровно на одну операцию, и оставлять
      // на чужом устройстве живой токен из письма незачем.
      persistSession: false,
      autoRefreshToken: false,
    },
  })

  // Ждём событие, а не делаем один снимок: detectSessionInUrl разбирает
  // ссылку АСИНХРОННО, и одиночный getSession() может опередить разбор —
  // тогда действительная ссылка выглядела бы просроченной.
  supabase.auth.onAuthStateChange((event, session) => {
    if (session && (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) {
      openForm()
    }
  })

  // hash может появиться уже после загрузки страницы (открыли, потом
  // подставили ссылку) — тогда пробуем разобрать её ещё раз
  window.addEventListener('hashchange', () => {
    const p = linkParams()
    if (p.error) return fail(BAD_LINK + ' ' + p.error)
    // Опустевший hash — это КЛИЕНТ убрал токен после разбора, а не человек
    // подставил новую ссылку. Перезагрузка здесь уничтожила бы токен и
    // превратила действительную ссылку в «недействительную».
    if (!p.hasToken) return
    if (!ready) location.reload()
  })

  async function init() {
    // 1. Явная ошибка в ссылке — говорим сразу, ждать нечего.
    if (link.error) return fail(BAD_LINK + ' ' + link.error)

    // 2. Токена в ссылке нет вовсе — тоже сразу, без ожидания. Раньше в этом
    //    случае страница 2,5 секунды делала вид, что проверяет.
    const { data } = await supabase.auth.getSession()
    if (data.session) return openForm()
    if (!link.hasToken) return fail(BAD_LINK + ' ' + HINT_NEW)

    // 3. Токен ЕСТЬ — значит ссылка на вид нормальная, и объявлять её
    //    недействительной по таймеру нельзя.
    //
    //    Так и было: ждали 2,5 с и вызывали fail(), а тот ставит флаг, после
    //    которого openForm() уже не сработает. На мобильном интернете разбор
    //    (сеть до Supabase плюс загрузка библиотеки с CDN) в это окно не
    //    укладывается — и ДЕЙСТВИТЕЛЬНАЯ ссылка выглядела просроченной.
    //
    //    Ждём дольше и, если не дождались, честно говорим, что проверить не
    //    удалось, а не обвиняем ссылку.
    setTimeout(() => {
      fail('Не удалось проверить ссылку — похоже, нет связи. Обновите страницу.')
    }, 20000)
  }

  init()

  // Собственно смена пароля.
  //
  // Обработчика здесь не было вовсе: форма отправлялась браузером обычным
  // GET на этот же адрес, hash с токеном при этом терялся, страница
  // перезагружалась уже без сессии — и выглядело это как «ввёл пароль,
  // ничего не произошло». preventDefault обязателен по той же причине.
  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    hide(msg)
    const a = pw.value
    const b = pw2.value
    if (a.length < 6) return say('Пароль должен быть не короче 6 символов.', 'err')
    if (a !== b) return say('Пароли не совпадают.', 'err')

    go.disabled = true
    const label = go.textContent
    go.textContent = 'Сохраняем…'
    try {
      const { error } = await supabase.auth.updateUser({ password: a })
      if (error) throw error
      hide(form)
      say('Пароль изменён. Вернитесь в приложение и войдите с новым паролем.', 'ok')
      // Токен из письма больше не нужен: гасим сессию, чтобы на чужом
      // устройстве после смены пароля не осталось доступа к аккаунту.
      supabase.auth.signOut().catch(() => {})
    } catch (err) {
      // Причину показываем как есть: «не удалось» без текста уже стоило нам
      // лишних итераций в других местах проекта.
      say(err && err.message ? err.message : 'Не удалось сменить пароль.', 'err')
      go.disabled = false
      go.textContent = label
    }
  })
</script>
</body>
</html>
